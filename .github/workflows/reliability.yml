name: Reliability checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies (no install scripts)
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run syntax, accounting, and IndexedDB integration checks
        run: npm run check
