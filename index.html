<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <script>
    // Apply the saved theme before the first paint so dark mode doesn't flash white.
    (function () {
      try {
        var pref = localStorage.getItem("wealthOSTheme") || "system";
        var dark = pref === "dark" || (pref === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0d1017");
      } catch (e) {}
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Wealth OS" />
  <title>Wealth OS</title>
  <link rel="manifest" href="./manifest-v181.webmanifest" />
  <link rel="icon" href="./icons/wealth-os-v173-32.png" type="image/png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/wealth-os-v173-180.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
